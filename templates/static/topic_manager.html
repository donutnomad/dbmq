<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 管理 - DBMQ</title>
    <link rel="stylesheet" href="/static/css/topic_manager.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="/api/v1/dashboard" class="back-button">← 返回仪表板</a>
                <h1>Topic 管理</h1>
            </div>
            <a href="/api/v1/dashboard/topics/create" class="btn-create">+ 创建新 Topic</a>
        </div>

        <div class="section">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div>加载 Topics 中...</div>
            </div>

            <div id="content" style="display: none;">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Topic 名称</th>
                                <th>分区数</th>
                                <th>消息数</th>
                                <th>存储大小</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="topicsTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/topic_manager.js"></script>
</body>
</html>
